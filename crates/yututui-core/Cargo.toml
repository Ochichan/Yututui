[package]
name = "yututui-core"
version = "1.7.3"
edition = "2024"
publish = false
description = "Pure playback policies shared by yututui playback owners."
license = "MIT"

[features]
default = []

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }

[lints.rust]
